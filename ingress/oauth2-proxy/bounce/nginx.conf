# Bounce unauthenticated browsers to auth.joed.dev so CSRF cookies are set
# on the auth host (Traefik errors middleware cannot do an external redirect).
#
# Traefik may pass rd= already percent-encoded; handle both forms.
map $arg_rd $rd_https {
    default                 $arg_rd;
    ~*^http://(.*)$         https://$1;
    ~*^http%3A%2F%2F(.*)$   https://$1;
}

server {
    listen 80;
    server_name _;

    location / {
        # Default landing after login if rd is missing or just "/"
        if ($rd_https = "") {
            return 302 https://auth.joed.dev/oauth2/start?rd=https://grafana.joed.dev/;
        }
        if ($rd_https = "/") {
            return 302 https://auth.joed.dev/oauth2/start?rd=https://grafana.joed.dev/;
        }
        if ($rd_https = "%2F") {
            return 302 https://auth.joed.dev/oauth2/start?rd=https://grafana.joed.dev/;
        }
        return 302 https://auth.joed.dev/oauth2/start?rd=$rd_https;
    }
}
