# Shared Google SSO via oauth2-proxy (Traefik forwardAuth).
# Installed by this repo's workflow to /opt/services/infra/oauth2-proxy/compose.yml on glados.
#
# Secrets live only on glados, in /opt/services/data/app-env/oauth2-proxy.env:
#   OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET,
#   OAUTH2_PROXY_PASS_ACCESS_TOKEN
#
# Google Cloud OAuth client (Web application):
#   Authorized JavaScript origins: https://auth.joed.dev
#   Authorized redirect URIs:      https://auth.joed.dev/oauth2/callback
#
# Any Google account can sign in (EMAIL_DOMAINS=*); who may use which app is
# decided by access.joed.dev (the access-check middleware in sso.yml).

services:
  # Returns 302 → https://auth.joed.dev/oauth2/start?rd=... so the browser
  # sets CSRF cookies on the auth host (not via an internal Traefik subrequest).
  sso-bounce:
    image: nginx:1.27-alpine
    container_name: sso-bounce
    restart: unless-stopped
    volumes:
      - ./bounce/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      # No public router — only used as Traefik errors service (sso-bounce@docker)
      traefik.http.services.sso-bounce.loadbalancer.server.port: "80"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    container_name: oauth2-proxy
    restart: unless-stopped
    env_file:
      - /opt/services/data/app-env/oauth2-proxy.env
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_REAL_CLIENT_IP_HEADER: X-Forwarded-For
      # Plural — CookieDomains is a string list in oauth2-proxy v7
      OAUTH2_PROXY_COOKIE_DOMAINS: .joed.dev
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      # true: unique CSRF cookie per concurrent login flow. Needed because
      # apps like Home Assistant fire several unauthenticated requests in
      # parallel (manifest.json, its own /auth/authorize flow, etc.) — with
      # this false they all share one CSRF cookie and clobber each other,
      # causing intermittent "CSRF token mismatch" 403s on /oauth2/callback.
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST_LIMIT: "5"
      OAUTH2_PROXY_WHITELIST_DOMAINS: .joed.dev,joed.dev
      OAUTH2_PROXY_REDIRECT_URL: https://auth.joed.dev/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/authenticated-emails.txt
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_FOOTER: "-"
    volumes:
      - ${OAUTH2_PROXY_EMAILS_PATH:-/opt/services/data/app-assets/oauth2-proxy/authenticated-emails.txt}:/etc/oauth2-proxy/authenticated-emails.txt:ro
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      # OAuth endpoints stay on oauth2-proxy
      traefik.http.routers.oauth2-proxy.rule: Host(`auth.joed.dev`) && PathPrefix(`/oauth2`)
      traefik.http.routers.oauth2-proxy.entrypoints: web
      traefik.http.routers.oauth2-proxy.priority: "100"
      traefik.http.routers.oauth2-proxy.service: oauth2-proxy
      traefik.http.services.oauth2-proxy.loadbalancer.server.port: "4180"
      # Bare auth.joed.dev/ is not an app — send people to Grafana after login
      traefik.http.routers.oauth2-proxy-root.rule: Host(`auth.joed.dev`)
      traefik.http.routers.oauth2-proxy-root.entrypoints: web
      traefik.http.routers.oauth2-proxy-root.priority: "1"
      traefik.http.routers.oauth2-proxy-root.middlewares: auth-root-to-grafana
      traefik.http.routers.oauth2-proxy-root.service: oauth2-proxy
      traefik.http.middlewares.auth-root-to-grafana.redirectregex.regex: ^https?://[^/]+/?$
      traefik.http.middlewares.auth-root-to-grafana.redirectregex.replacement: https://grafana.joed.dev/
      traefik.http.middlewares.auth-root-to-grafana.redirectregex.permanent: "false"

networks:
  proxy:
    external: true
