# Shared Google SSO — Traefik forwardAuth → oauth2-proxy, then access.joed.dev.
# Attach to routers: middlewares: sso@file
# Installed by this repo's workflow to /opt/services/infra/traefik/dynamic/sso.yml on glados.
#
# On 401, bounce the *browser* to auth.joed.dev (via sso-bounce) so CSRF
# cookies are set on the auth host. Do not call /oauth2/start as an internal
# Traefik subrequest — that causes "Unable to find a valid CSRF token".
#
# oauth2-proxy lets any Google account sign in; access-check then decides who
# may use which app (see r2pen2/access). Without access it answers 302 to the
# request-access page, which sso-errors (401-403 only) leaves alone.
http:
  middlewares:
    sso-auth:
      forwardAuth:
        address: http://oauth2-proxy:4180/oauth2/auth
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Preferred-Username
    access-check:
      forwardAuth:
        address: http://access:3000/check
        # The app's host must come from Traefik, not from a client-sent X-Forwarded-Host.
        trustForwardHeader: false
    sso-errors:
      errors:
        status:
          - "401-403"
        statusRewrites:
          "401": "302"
          "403": "302"
        service: sso-bounce@docker
        query: "/?rd={url}"
    sso:
      chain:
        middlewares:
          - sso-errors
          - sso-auth
          - access-check
