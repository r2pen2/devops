name: QA wildcard bootstrap (reusable)

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: r2pen2/devops/ci/actions/tooling@main

      - name: Ensure *.joed.dev DNS + tunnel ingress
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node .deploy-infra/scripts/qa/ensure-qa-wildcard.mjs
