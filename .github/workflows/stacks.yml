# This repo's stacks (stacks.json) → glados. See ci/scripts/deploy-stacks.mjs.
name: Deploy stacks

on:
  push:
    branches: [main]
    paths:
      - "stacks.json"
      - "host/**"
      - "ingress/**"
      - "updates/**"
      - "ci/scripts/deploy-stacks.mjs"
  workflow_dispatch:
    inputs:
      only:
        description: 'Stacks to deploy (comma-separated), or "all"'
        default: all
      dry_run:
        description: Only show what would change
        type: boolean
        default: false

concurrency:
  group: deploy-stacks
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/reusable-stacks.yml
    with:
      only: ${{ inputs.only || 'all' }}
      dry_run: ${{ inputs.dry_run || false }}
