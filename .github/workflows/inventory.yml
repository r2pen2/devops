# What's actually running on glados, and the config behind it, as a 1-day artifact.
# Secrets never leave glados: *.env files are reduced to their key names, secret-looking values in
# config files are replaced with <redacted>, and key/cert/credential files are listed but not copied.
name: Inventory glados

on:
  workflow_dispatch:

jobs:
  inventory:
    runs-on: [self-hosted, glados]
    steps:
      - name: Collect
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/inventory"
          sudo rm -rf "$OUT"; mkdir -p "$OUT/files"

          sudo docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Label "com.docker.compose.project.config_files"}}	{{.Label "com.docker.compose.project.environment_file"}}' | sort > "$OUT/containers.tsv"
          : > "$OUT/unhealthy-logs.txt"
          for c in $(sudo docker ps -a --filter status=restarting --format '{{.Names}}') $(sudo docker ps --format '{{.Names}}\t{{.Status}}' | awk -F'\t' '$2 ~ /seconds|unhealthy/ {print $1}'); do
            { echo "== $c"; sudo docker logs --tail 15 "$c" 2>&1 | sed -E "s#(://)[^/@ ]+@#\1<redacted>@#g"; } >> "$OUT/unhealthy-logs.txt"
          done
          { echo "## uptime"; uptime; echo "## memory"; free -m; echo "## previous boot: kernel OOM / hung tasks"; sudo journalctl -b -1 -k --no-pager 2>/dev/null | grep -i -E "out of memory|oom-kill|killed process|hung_task|blocked for more than" | tail -40 || true; echo "## previous boot: last 60 lines"; sudo journalctl -b -1 --no-pager -n 60 2>/dev/null || true; echo "## previous boot: network events in its last 40 minutes"; end=$(sudo journalctl -b -1 -n 1 --no-pager -o short-unix 2>/dev/null | tail -1 | cut -d. -f1); [ -n "$end" ] && sudo journalctl -b -1 --no-pager --since "@$((end-2400))" 2>/dev/null | grep -i -E "wlp|wlan|enp|eth0|carrier|link (is )?(up|down)|dhcp|networkmanager|systemd-networkd|resolved|deauth|disassoc|brcm|wl_|wpa_supplicant|netplan|no route" | tail -60 || true; echo "## boots"; sudo journalctl --list-boots --no-pager 2>/dev/null | tail -5 || true; } > "$OUT/host.txt"
          for c in cloudflared watchtower; do { echo "== $c"; sudo docker logs --tail 40 "$c" 2>&1 | sed -E "s#(://)[^/@ ]+@#\1<redacted>@#g; s#(token[= ]+)[A-Za-z0-9._-]{12,}#\1<redacted>#Ig"; } >> "$OUT/key-logs.txt"; done
          sudo docker network ls --format '{{.Name}}\t{{.Driver}}' > "$OUT/networks.tsv"
          sudo docker volume ls --format '{{.Name}}' > "$OUT/volumes.txt"
          sudo find /opt/services -maxdepth 3 -not -path '/opt/services/data/app-assets/*/*' -not -path '*/backups/*' | sort > "$OUT/tree.txt"
          systemctl list-units --type=service --all --no-pager --plain | grep -i -E 'cloudflared|actions|docker|traefik|grafana|prometheus|node_exporter|watchtower' > "$OUT/services.txt" || true
          { echo "## root"; sudo crontab -l 2>/dev/null || true; echo "## joe"; crontab -l 2>/dev/null || true; echo "## /etc/cron.d"; ls /etc/cron.d 2>/dev/null || true; } > "$OUT/cron.txt"

          # Every compose file a running container came from, plus everything under /opt/services/infra and /etc/cloudflared.
          {
            sudo docker ps -a --format '{{.Label "com.docker.compose.project.config_files"}}' | tr ',' '\n'
            sudo find /opt/services/infra /etc/cloudflared /home/joe/.cloudflared -type f -not -path '*/backups/*' -size -256k 2>/dev/null || true
          } | grep -v '^$' | sort -u > "$OUT/sources.txt"

          secretish='(secret|password|passwd|token|api[_-]?key|private[_-]?key|credential|client[_-]?id|cookie|auth[_-]?key|dsn|webhook)'
          : > "$OUT/redactions.txt"; : > "$OUT/skipped.txt"; : > "$OUT/env-keys.txt"
          while read -r f; do
            sudo test -f "$f" || { echo "missing $f" >> "$OUT/skipped.txt"; continue; }
            base="$(basename "$f")"
            case "$base" in
              *.env|.env|*.env.*)
                { echo "== $f"; sudo sed -E -n 's/^([A-Za-z_][A-Za-z0-9_]*)=.*/\1/p' "$f"; } >> "$OUT/env-keys.txt"; continue ;;
              acme.json|*.pem|*.key|*.crt|*.p12|*.pfx|*credentials*|cert.json|*.db|*.sqlite)
                echo "secret/binary, not copied: $f" >> "$OUT/skipped.txt"; continue ;;
            esac
            if ! sudo grep -Iq . "$f"; then echo "binary, not copied: $f" >> "$OUT/skipped.txt"; continue; fi
            dest="$OUT/files$f"; mkdir -p "$(dirname "$dest")"
            # KEY: value / KEY=value / "key": "value" with a secret-looking key; ${VAR} references are kept.
            sudo cat "$f" | sed -E \
              -e "/\\\$\{[A-Za-z_]/b" \
              -e "s/^([^:=]*${secretish}[A-Za-z0-9_\"'-]*[\"']?[[:space:]]*[:=][[:space:]]*)[\"']?[^\"'[:space:]#,}]{6,}[\"']?/\1<redacted>/I" \
              -e "s#(://)[^/@[:space:]\"']+@#\1<redacted>@#g" \
              -e "s#(webhooks?/)[^[:space:]\"']+#\1<redacted>#Ig" > "$dest"
            sudo grep -n -i -E "${secretish}[A-Za-z0-9_\"'-]*[\"']?[[:space:]]*[:=]" "$f" | grep -v '\${' | sed -E "s/[:=].*/ (value redacted)/; s#^#$f:#" >> "$OUT/redactions.txt" || true
          done < "$OUT/sources.txt"
          sudo chown -R "$(id -u)" "$OUT"
          echo "copied $(find "$OUT/files" -type f | wc -l) files; $(wc -l < "$OUT/redactions.txt") redacted lines"

      - uses: actions/upload-artifact@v4
        with:
          name: glados-inventory
          path: ${{ runner.temp }}/inventory
          retention-days: 1
