services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    environment:
      DOZZLE_HOSTNAME: glados
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      # Container logs UI (fleet board owns status.joed.dev)
      traefik.http.routers.dozzle.rule: Host(`logs.joed.dev`)
      traefik.http.routers.dozzle.entrypoints: web
      traefik.http.routers.dozzle.middlewares: sso@file
      traefik.http.services.dozzle.loadbalancer.server.port: "8080"

volumes:
  dozzle_data:

networks:
  proxy:
    external: true
