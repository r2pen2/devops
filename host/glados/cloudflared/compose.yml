services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run --token ${TUNNEL_TOKEN}
    networks:
      - proxy
    labels:
      - autoheal=true
    # cloudflared stays "running" while disconnected; /ready fails until edge sessions exist.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Docker does not restart unhealthy containers by itself; autoheal does.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: cloudflared-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  proxy:
    external: true
